name: Publish Windows and Linux HD previews
on:
  push:
    branches: [release/hd-smoothing-20261026]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-preview-${{ github.sha }}
  cancel-in-progress: true
jobs:
  superseded:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Cancel older attempts for this release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID'])
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?branch=release%2Fhd-smoothing-20261026&per_page=50'],text=True))
          for run in data['workflow_runs']:
              if run['name']=='Publish Windows and Linux HD previews' and run['id']<current and run['status']!='completed':
                  subprocess.run(['gh','api','--method','POST',f"repos/{repo}/actions/runs/{run['id']}/cancel"],check=False)
          PYTHON
  windows:
    needs: superseded
    uses: ./.github/workflows/windows-release.yml
  linux:
    needs: superseded
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the main Ubuntu mirrors
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          files=[Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in files:
              if not path.is_file():continue
              text=path.read_text()
              text=text.replace('mirror+file:/etc/apt/apt-mirrors.txt','https://archive.ubuntu.com/ubuntu')
              text=text.replace('mirror+file:/etc/apt/apt-mirrors-security.txt','https://security.ubuntu.com/ubuntu')
              text=text.replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu')
              path.write_text(text)
          PYTHON
      - name: Install build and runtime dependencies
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y cmake ninja-build g++ libsdl2-dev fonts-dejavu-core
      - name: Build without private game inputs
        run: |
          cmake -S . -B "$RUNNER_TEMP/linux-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DTHIRD_AGE_PORTABLE_RELEASE=ON \
            -DTHIRD_AGE_BUILD_PRESENTATION_TESTS=ON -DTHIRD_AGE_ALLOW_HEADLESS=OFF \
            -DGBARECOMP_SELFHEAL_RECOMPILE_DEFAULT=OFF -DGBARECOMP_ENABLE_MODS=OFF \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            '-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc'
          cmake --build "$RUNNER_TEMP/linux-build" --target third-age-pc presentation-settings --parallel 2
      - name: Test live menu, preset and persistence
        run: ctest --test-dir "$RUNNER_TEMP/linux-build" -R '^presentation-settings$' --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: third-age-linux-tested-${{ github.sha }}
          path: |
            ${{ runner.temp }}/linux-build/third-age-pc
            ${{ runner.temp }}/linux-build/CMakeCache.txt
            ${{ runner.temp }}/linux-build/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the main Ubuntu mirrors
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          files=[Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in files:
              if not path.is_file():continue
              text=path.read_text()
              text=text.replace('mirror+file:/etc/apt/apt-mirrors.txt','https://archive.ubuntu.com/ubuntu')
              text=text.replace('mirror+file:/etc/apt/apt-mirrors-security.txt','https://security.ubuntu.com/ubuntu')
              text=text.replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu')
              path.write_text(text)
          PYTHON
      - name: Install Linux runtime for dependency audit
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libsdl2-2.0-0
      - name: Assemble, audit and publish separate platform releases
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B tools/publish_desktop.py --work "$RUNNER_TEMP/desktop-publication"
