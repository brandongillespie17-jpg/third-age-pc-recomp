name: Publish tested HD desktop artifacts
on:
  push:
    branches: [release/hd-publication-20261026]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-tested-hd-20261026
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the main Ubuntu mirrors
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          files=[Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in files:
              if not path.is_file():continue
              text=path.read_text()
              text=text.replace('mirror+file:/etc/apt/apt-mirrors.txt','https://archive.ubuntu.com/ubuntu')
              text=text.replace('mirror+file:/etc/apt/apt-mirrors-security.txt','https://security.ubuntu.com/ubuntu')
              text=text.replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu')
              path.write_text(text)
          PYTHON
      - name: Install Linux runtime for dependency audit
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libsdl2-2.0-0
      - name: Assemble, audit and publish separate platform releases
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B tools/publish_desktop.py --work "$RUNNER_TEMP/desktop-publication" --build-commit 4beaa8d235b3e40549c675fceb1d0218431459e9 --build-run 40405711931
